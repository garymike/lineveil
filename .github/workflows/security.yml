name: Security

on:
  # Scan pushes to main and every PR. Feature-branch pushes are covered by their
  # PR, so scanning every branch push too would only double-bill.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Cancel superseded runs on the same ref (rapid pushes / PR updates).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default every job to read-only; a job that needs more raises it explicitly below.
# Checkov's CKV2_GHA_1 fails the file when this block is absent, not only on write-all.
permissions:
  contents: read

# Every job below calls a reusable workflow in garymike/security-workflows, pinned
# to a commit SHA. The caller's permissions block is a hard ceiling: a reusable
# workflow that asks for a permission the caller withheld fails at startup with
# no logs, so each job grants exactly what its callee declares. Do not add
# `secrets: inherit`; none of the callees need a secret.

jobs:
  scan:
    permissions:
      contents: read
      packages: read       # reusable pulls the pinned betterleaks image from GHCR
      pull-requests: read
    uses: garymike/security-workflows/.github/workflows/security-scan.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-21

  gha-security:
    # zizmor + actionlint over .github/workflows: injection, excessive permissions,
    # unpinned actions.
    permissions:
      contents: read
      packages: read
    uses: garymike/security-workflows/.github/workflows/gha-security.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-21

  sast:
    # Semgrep p/default over the C sources under src/ and tests/ and the Python
    # helpers under tools/.
    permissions:
      contents: read
      packages: read
      security-events: write   # public repo: SARIF upload to code scanning stays on
    uses: garymike/security-workflows/.github/workflows/sast.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-21

  # No iac-security job: the tree carries no Dockerfile, compose file, Bicep or
  # Terraform for Checkov to read. Add it back if any of those arrive.

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: garymike/security-workflows/.github/workflows/security-audit.yml@79b45d2aa10eff24b76ebab642bf32d36aabe8d6 # main @ 2026-10-21
