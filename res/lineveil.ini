; lineveil configuration
; Saved changes are picked up automatically.

[lineveil]
; 1 = overlay on at startup
enabled=1

; --- Line spacing: pick ONE of the three styles below ---
;
; 1. Preset: the line count of a real video standard, the same on every
;    monitor whatever its resolution:
;      224p  arcade boards, much of SNES
;      240p  NES, Genesis, PS1 and other NTSC consoles
;      288p  PAL consoles
;      480   VGA 640x480, 480i/480p video
preset=
;
; 2. Custom line count (16..2160). Overrides preset.
lines=
;
;    With preset or lines: percent of each line cycle that is dark (10..90).
fill=50
;
; 3. Fixed pixel spacing, used when preset and lines are empty.
;    Distance from one line to the next (2..64) and line thickness.
period=3
thickness=1

; Line opacity 0..255
opacity=80

; Line color as RRGGBB hex
color=000000

; horizontal or vertical
orientation=horizontal

; 1 = hide overlay from screenshots and screen sharing (Windows 10 2004+)
exclude_from_capture=0

; gdi (default, works everywhere) or dcomp (Windows 8+, experimental:
; uses far less memory in Windows itself, falls back to gdi on failure)
renderer=gdi

; Toggle hotkey, e.g. Ctrl+Alt+F12, Shift+Win+S, or None.
; Modifiers: Ctrl, Alt, Shift, Win. Keys: A-Z, 0-9, F1-F24, Num0-Num9,
; Space, Tab, Enter, Esc, Insert, Delete, Home, End, PageUp, PageDown,
; Up, Down, Left, Right, Pause, ScrollLock.
hotkey=Ctrl+Alt+F12
