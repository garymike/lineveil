name: release

# Push a tag like v0.1.0 to build, checksum, attest, and draft a GitHub release.
# Run manually (Actions > release > Run workflow) for a dry run: everything
# except creating the release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches res/version.h
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $parts = foreach ($k in 'MAJOR','MINOR','PATCH') {
            (Select-String -Path res/version.h -Pattern "LV_VERSION_$k\s+(\d+)").Matches[0].Groups[1].Value
          }
          $expected = 'v' + ($parts -join '.')
          if ($env:TAG -ne $expected) { throw "Tag $env:TAG does not match res/version.h ($expected)" }
          Write-Host "Version OK: $expected"

      - name: Build (MSVC, no CRT)
        shell: cmd
        run: build.bat ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: build/lineveil-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
      id-token: write      # sign provenance via Sigstore
      attestations: write  # store attestations on the repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Name binaries and write checksums
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver=dev
          if [ "$REF_TYPE" = "tag" ]; then ver="$TAG"; fi
          cd dist
          for a in x64 x86 arm64; do
            mv "lineveil-$a.exe" "lineveil-$ver-windows-$a.exe"
          done
          sha256sum -- *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Download

          Pick the build for your machine. Most PCs are **x64**; Surface Pro X and
          other Snapdragon PCs are **arm64**; **x86** is for 32-bit Windows.

          No installer: run the exe. It starts in the tray. Config lives at
          \`%APPDATA%\\lineveil\\lineveil.ini\`.

          ## Verify

          Checksums (PowerShell):
          \`\`\`powershell
          Get-FileHash .\\lineveil-$TAG-windows-x64.exe -Algorithm SHA256
          \`\`\`
          and compare with \`SHA256SUMS.txt\`.

          Build provenance (GitHub CLI): proves the exe was built by this
          repo's release workflow from tag \`$TAG\`.
          \`\`\`
          gh attestation verify lineveil-$TAG-windows-x64.exe --repo $GITHUB_REPOSITORY
          \`\`\`

          The binaries are not code-signed yet, so Windows SmartScreen may warn
          on first run.

          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lineveil $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            --draft
